[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "coincounter"
version = "0.1.0"
description = "Reusable coin-counting engines"
requires-python = ">=3.9"
dependencies = ["Pillow>=9", "numpy>=1.21"]

[project.optional-dependencies]
hough = ["opencv-python-headless>=4.7,<5"]
regression = ["torch>=2.1", "torchvision>=0.16"]

[project.scripts]
coincounter = "coincounter.cli.count:main"

[tool.setuptools.packages.find]
where = ["src"]
